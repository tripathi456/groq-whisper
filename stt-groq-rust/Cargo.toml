[package]
name = "stt-groq-rust"
version = "0.1.0"
edition = "2021"
authors = ["Groq Whisper Port"]
description = "A Rust port of the Groq Whisper speech-to-text application"

[dependencies]
# Audio recording
cpal = "0.15.2"
hound = "3.5.1"
byteorder = "1.4.3"

# HTTP requests
reqwest = { version = "0.11", features = ["json", "multipart", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Keyboard handling
device_query = "3.0.0"

# Clipboard operations
arboard = "3.2.1"
enigo = "0.3.0"

# Notifications
notify-rust = "4.9.0"

# Utility
tempfile = "3.8.1"
anyhow = "1.0.75"
thiserror = "2"
itertools = "0.14.0"
dotenv = "0.15.0"
num-traits = "0.2.18"

# Tracing
tracing = { version = "0.1.40", features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2.3"
tracing-attributes = "0.1.27"
time = { version = "0.3", features = ["macros"] }
