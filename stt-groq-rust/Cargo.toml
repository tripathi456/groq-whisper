[package]
name = "stt-groq-rust"
version = "0.1.0"
edition = "2021"
authors = ["Groq Whisper Port"]
description = "A Rust port of the Groq Whisper speech-to-text application"

[features]
default = ["audio"]
audio = ["cpal", "hound", "byteorder"]

[dependencies]
# Audio recording - now optional
cpal = { version = "0.15.2", optional = true }
hound = { version = "3.5.1", optional = true }
byteorder = { version = "1.4.3", optional = true }

# HTTP requests
reqwest = { version = "0.11", features = ["json", "multipart", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Keyboard handling
device_query = { version = "1.1.3", optional = true }

# Clipboard operations
arboard = "3.2.1"
enigo = "0.1.2"

# Notifications
notify-rust = "4.9.0"

# Utility
tempfile = "3.8.1"
anyhow = "1.0.75"
thiserror = "1.0.50"
itertools = "0.11.0"
dotenv = "0.15.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"