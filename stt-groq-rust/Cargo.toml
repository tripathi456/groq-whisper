[package]
name = "stt-groq-rust"
version = "0.1.0"
edition = "2021"
authors = ["Groq Whisper Port"]
description = "A Rust port of the Groq Whisper speech-to-text application"

[dependencies]
# Audio recording - only include on supported platforms
cpal = { version = "0.15.2", optional = true }
hound = "3.5.1"
byteorder = "1.4.3"

# HTTP requests
reqwest = { version = "0.11", features = ["json", "multipart", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Keyboard handling - optional for environments without X11
device_query = { version = "3.0.0", optional = true }

# Clipboard operations - optional for environments without X11
arboard = { version = "3.2.1", optional = true }
enigo = { version = "0.3.0", optional = true }

# Notifications - optional for environments without desktop
notify-rust = { version = "4.9.0", optional = true }

# Utility
tempfile = "3.8.1"
anyhow = "1.0.75"
thiserror = "1.0.69"
itertools = "0.14.0"
dotenv = "0.15.0"
num-traits = "0.2.18"

# Tracing
tracing = { version = "0.1.40", features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "json", "fmt","chrono"] }
tracing-appender = "0.2.3"
tracing-attributes = "0.1.27"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1.43.0", features = ["full"] }
rdev = { version = "0.5.3", features = ["serde", "serialize"], optional = true }

[features]
default = []
audio = ["cpal"]
ui = ["device_query", "arboard", "enigo", "notify-rust", "rdev"]